name: Deploy v5 to GitHub Pages

on:
  push:
    branches:
      - v5
  workflow_run:
    workflows:
      - Sync Public Notes
    types:
      - completed
    branches:
      - v5
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install Quartz plugins
        run: npx quartz plugin install

      - name: Build Quartz
        run: npx quartz build -d content -v

      - uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Wait before retry 2
        if: steps.deployment.outcome != 'success'
        run: sleep 10

      - id: deployment_retry_2
        if: steps.deployment.outcome != 'success'
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Wait before retry 3
        if: steps.deployment.outcome != 'success' && steps.deployment_retry_2.outcome != 'success'
        run: sleep 20

      - id: deployment_retry_3
        if: steps.deployment.outcome != 'success' && steps.deployment_retry_2.outcome != 'success'
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Fail if all deploy attempts failed
        if: always()
        run: |
          if [ "${{ steps.deployment.outcome }}" = "success" ] || [ "${{ steps.deployment_retry_2.outcome }}" = "success" ] || [ "${{ steps.deployment_retry_3.outcome }}" = "success" ]; then
            exit 0
          fi
          exit 1
